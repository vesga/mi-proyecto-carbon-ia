version: '3.8'

services:
  carbon_frontend:
    build:
      context: ./static
      dockerfile: Dockerfile.frontend
    container_name: carbon_frontend
    ports:
      - "80:80"
    depends_on:
      - carbon_backend
    restart: always

  carbon_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carbon_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://carbon_user:carbon_pass@carbon_postgres:5432/carbon_db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - carbon_postgres
    restart: always

  carbon_postgres:
    image: postgres:15-alpine
    container_name: carbon_postgres
    environment:
      - POSTGRES_DB=carbon_db
      - POSTGRES_USER=carbon_user
      - POSTGRES_PASSWORD=carbon_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data: